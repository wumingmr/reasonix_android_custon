name: Verify uploaded binary and release

# 本地 Termux 编译并把二进制推送到 artifacts/reasonix-android-arm64 后,
# 校验其版本与上游最新 tag 一致且 hash 与已发布 release 不同,才创建/更新 release。

on:
  push:
    branches: [master]
    paths: ['artifacts/reasonix-android-arm64']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag, e.g. termux-v1.39.11-r1 (blank uses base tag)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    concurrency:
      group: termux-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve upstream tag, binary version, and hash
        id: info
        run: |
          # This repo's Termux adaptation is pinned to the 1.x line: 2.x
          # restructured internal/ so the patch no longer applies, and no
          # Android support exists there. Resolve the newest 1.x tag rather
          # than the newest tag overall, so a 2.x release does not make every
          # 1.x build look stale here. Same rule as update-reasonix.sh.
          UPSTREAM="$(git ls-remote --tags --refs https://github.com/esengine/DeepSeek-Reasonix.git \
            | awk -F/ '{print $NF}' | grep -E '^v1\.[0-9]+\.' | grep -v -- '-rc' | sort -V | tail -1)"
          VERSION="$(go version -m artifacts/reasonix-android-arm64 | grep -oE 'main\.version=[^ ]+' | cut -d= -f2)"
          HASH="$(sha256sum artifacts/reasonix-android-arm64 | awk '{print $1}')"
          echo "upstream=$UPSTREAM"
          echo "version=$VERSION"
          echo "hash=$HASH"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Skip unless binary tracks the pinned upstream line
        id: check
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VER="${{ steps.info.outputs.version }}"
          TAG="${{ steps.info.outputs.upstream }}"
          # The Makefile stamps <upstream>-termux.<sha> on purpose so an
          # installed build is distinguishable from the official one. Compare the
          # upstream part only; demanding an exact match would skip every
          # Termux build forever.
          BASE="${VER%%-termux*}"
          if [ -z "$TAG" ]; then
            echo "could not resolve an upstream 1.x tag; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${TAG#v}" != "$BASE" ]; then
            echo "binary tracks upstream $BASE but the pinned tag is $TAG; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source scripts/termux/release-identity.sh
          termux_verify_binary_version "$VER" "$TAG"
          if [ -z "$REQUESTED_RELEASE_TAG" ]; then
            REQUESTED_RELEASE_TAG="$(git tag --points-at HEAD --list "termux-$TAG*" | sort -V | tail -1)"
            test -n "$REQUESTED_RELEASE_TAG" || { echo 'No release tag on this commit; refusing publication'; exit 1; }
          fi
          termux_release_identity "$TAG" "$REQUESTED_RELEASE_TAG"
          TAG_COMMIT="$(git rev-parse "$TERMUX_RELEASE_TAG^{commit}")"
          test "$TAG_COMMIT" = "$GITHUB_SHA" || { echo 'Release tag does not identify uploaded artifact commit'; exit 1; }
          git diff --quiet "$TAG_COMMIT" HEAD -- artifacts/reasonix-android-arm64
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TERMUX_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$TERMUX_RELEASE_ASSET" >> "$GITHUB_OUTPUT"
          echo "Release will use $TERMUX_RELEASE_TAG (binary tracks $BASE)"

      - name: Create or update release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ steps.check.outputs.tag }}"
          REL_TAG="${{ steps.check.outputs.release_tag }}"
          HASH="${{ steps.info.outputs.hash }}"
          # Always the versioned name. An earlier version probed the existing
          # assets and fell back to the bare name, which made the asset name
          # depend on the release's history: a rebuilt release silently switched
          # to the bare name, and SHA256SUMS generated for one name then no
          # longer matched the uploaded file. One name, derived from $TAG only.
          ASSET="${{ steps.check.outputs.asset }}"
          echo "release asset name: $ASSET"
          VERSION="${{ steps.info.outputs.version }}"
          # The notes live in a tracked template so the published text, the asset
          # name and the checksum cannot drift apart. A hand-edited release page
          # once kept naming an older binary after the asset had already been
          # replaced; rendering from the template on every run removes that gap.
          export TAG REL_TAG ASSET VERSION HASH REPO
          RENDER="$RUNNER_TEMP/rendered-notes.md"
          CHECKSUMS="$RUNNER_TEMP/SHA256SUMS"
          sed -e "s|\$TAG|$TAG|g" -e "s|\$REL_TAG|$REL_TAG|g" \
              -e "s|\$ASSET|$ASSET|g" -e "s|\$VERSION|$VERSION|g" \
              -e "s|\$HASH|$HASH|g" -e "s|\$REPO|$REPO|g" \
              release-notes-termux.md > "$RENDER"
          # Keep SHA256SUMS in step with the binary, otherwise the documented
          # `sha256sum -c SHA256SUMS` fails against a freshly uploaded asset.
          printf '%s  %s\n' "$HASH" "$ASSET" > "$CHECKSUMS"
          if gh release view "$REL_TAG" --repo "$REPO" >/dev/null 2>&1; then
            # A missing or unreadable previous asset just means we cannot compare
            # hashes; that must not abort the run under `bash -e`.
            OLD_HASH=""
            if gh release download "$REL_TAG" -p "$ASSET" --repo "$REPO" -D "$RUNNER_TEMP/relasset" --clobber >/dev/null 2>&1; then
              OLD_HASH="$(sha256sum "$RUNNER_TEMP/relasset/$ASSET" 2>/dev/null | awk '{print $1}' || true)"
            else
              echo "no existing $ASSET on $REL_TAG to compare against; uploading"
            fi
            # gh's "file#label" syntax sets a display label, not the asset's
            # name, so the file has to carry the target name itself.
            cp "artifacts/reasonix-android-arm64" "$RUNNER_TEMP/$ASSET"
            if [ -n "$OLD_HASH" ] && [ "$OLD_HASH" = "$HASH" ]; then
              echo "release $REL_TAG already carries this exact binary (sha256 $HASH); refreshing notes only"
            else
              echo "Existing release bytes differ or are unavailable; use a new revision tag, never overwrite an old asset"
              exit 1
            fi
            gh release upload "$REL_TAG" "$CHECKSUMS" --repo "$REPO" --clobber
            gh release edit "$REL_TAG" --repo "$REPO" --notes-file "$RENDER"
          else
            cp "artifacts/reasonix-android-arm64" "$RUNNER_TEMP/$ASSET"
            gh release create "$REL_TAG" \
              "$RUNNER_TEMP/$ASSET" \
              "$CHECKSUMS" \
              --repo "$REPO" \
              --verify-tag \
              --title "Reasonix ${REL_TAG#termux-} — Termux build" \
              --notes-file "$RENDER"
            echo "created $REL_TAG (sha256 $HASH)"
          fi
