name: Verify uploaded binary and release

# 本地 Termux 编译并把二进制推送到 artifacts/reasonix-android-arm64 后,
# 校验其版本与上游最新 tag 一致且 hash 与已发布 release 不同,才创建/更新 release。

on:
  push:
    branches: [master]
    paths: ['artifacts/reasonix-android-arm64']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve upstream tag, binary version, and hash
        id: info
        run: |
          # This repo's Termux adaptation is pinned to the 1.x line: 2.x
          # restructured internal/ so the patch no longer applies, and no
          # Android support exists there. Resolve the newest 1.x tag rather
          # than the newest tag overall, so a 2.x release does not make every
          # 1.x build look stale here. Same rule as update-reasonix.sh.
          UPSTREAM="$(git ls-remote --tags --refs https://github.com/esengine/DeepSeek-Reasonix.git \
            | awk -F/ '{print $NF}' | grep -E '^v1\.[0-9]+\.' | grep -v -- '-rc' | sort -V | tail -1)"
          VERSION="$(go version -m artifacts/reasonix-android-arm64 | grep -oE 'main\.version=[^ ]+' | cut -d= -f2)"
          HASH="$(sha256sum artifacts/reasonix-android-arm64 | awk '{print $1}')"
          echo "upstream=$UPSTREAM"
          echo "version=$VERSION"
          echo "hash=$HASH"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Skip unless binary tracks the pinned upstream line
        id: check
        run: |
          VER="${{ steps.info.outputs.version }}"
          TAG="${{ steps.info.outputs.upstream }}"
          # The Makefile stamps <upstream>-termux.<sha> on purpose so an
          # installed build is distinguishable from the official one. Compare the
          # upstream part only; demanding an exact match would skip every
          # Termux build forever.
          BASE="${VER%%-termux*}"
          if [ -z "$TAG" ]; then
            echo "could not resolve an upstream 1.x tag; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${TAG#v}" != "$BASE" ]; then
            echo "binary tracks upstream $BASE but the pinned tag is $TAG; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release will use tag termux-$TAG (binary tracks $BASE)"

      - name: Create or update release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ steps.check.outputs.tag }}"
          REL_TAG="termux-$TAG"
          HASH="${{ steps.info.outputs.hash }}"
          # Releases published before this workflow learned the versioned asset
          # name carry reasonix-android-arm64-v1.39.8; newer ones would be
          # uploaded as the bare reasonix-android-arm64. Match whichever exists
          # so an update replaces the real asset instead of adding a second one
          # under a different name.
          ASSET="reasonix-android-arm64-${TAG}"
          if ! gh release view "$REL_TAG" --json assets --jq '.assets[].name' --repo "$REPO" 2>/dev/null | grep -qx "$ASSET"; then
            ASSET="reasonix-android-arm64"
          fi
          echo "release asset name: $ASSET"
          if gh release view "$REL_TAG" --repo "$REPO" >/dev/null 2>&1; then
            # A missing or unreadable previous asset just means we cannot compare
            # hashes; that must not abort the run under `bash -e`.
            OLD_HASH=""
            if gh release download "$REL_TAG" -p "$ASSET" --repo "$REPO" -D /tmp/relasset --clobber >/dev/null 2>&1; then
              OLD_HASH="$(sha256sum "/tmp/relasset/$ASSET" 2>/dev/null | awk '{print $1}' || true)"
            else
              echo "no existing $ASSET on $REL_TAG to compare against; uploading"
            fi
            if [ -n "$OLD_HASH" ] && [ "$OLD_HASH" = "$HASH" ]; then
              echo "release $REL_TAG already carries this exact binary (sha256 $HASH); nothing to do"
              exit 0
            fi
            gh release upload "$REL_TAG" "artifacts/reasonix-android-arm64" "$REPO/$ASSET" --repo "$REPO" --clobber
            echo "updated $REL_TAG asset $ASSET (sha256 $HASH)"
          else
            printf '%s\n' \
              "Termux build of upstream [$TAG](https://github.com/esengine/DeepSeek-Reasonix/releases/tag/$TAG) with the adaptation patch." \
              "" \
              "- **$ASSET**: built locally on Termux (version $TAG, sha256 $HASH)" \
              "- **reasonix-termux.patch**: adaptation patch" \
              "- **update-reasonix.sh**: rebuild/update script" \
              "" \
              "Install:" \
              '```' \
              "cp $ASSET \$PREFIX/bin/reasonix" \
              "reasonix -v" \
              '```' > notes.md
            gh release create "$REL_TAG" \
              "artifacts/reasonix-android-arm64#$ASSET" \
              reasonix-termux.patch \
              update-reasonix.sh \
              --repo "$REPO" \
              --title "Reasonix $TAG — Termux build" \
              --notes-file notes.md
            echo "created $REL_TAG (sha256 $HASH)"
          fi
